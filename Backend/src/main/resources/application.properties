spring.application.name=Aravinda-Stores
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:1800}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
app.slips.directory=${SLIP_DIRECTORY:./private-slips}
app.business-zone=${BUSINESS_TIMEZONE:Asia/Colombo}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:6MB}
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.lpg.retail=INFO
spring.jackson.deserialization.fail-on-unknown-properties=true


app.products.images.directory=${PRODUCT_IMAGE_DIRECTORY:./storage/products}
app.products.images.max-bytes=${PRODUCT_IMAGE_MAX_BYTES:5242880}
app.products.images.max-dimension=${PRODUCT_IMAGE_MAX_DIMENSION:4000}

spring.config.import=optional:file:./.env[.properties]
